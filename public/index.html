<script type="module">
    // Initialize app
    import { initializeAuthListeners } from './js/auth.js';
    import { initializePageLoad } from './js/viewer.js';
    
    window.onload = async function() {
        console.log("=== App Initialized ===");
        
        // Firebase初期化完了を待つ
        await new Promise(resolve => setTimeout(resolve, 500));
        console.log("⏰ Firebase initialization wait complete");
        
        await initializeAuthListeners();
        await initializePageLoad();
    };
</script>
